[project]
name = "hn-tech-digest"
version = "0.1.0"
description = "HackerNews tech digest workflow: French summaries plus a short podcast audio, sent to Gmail"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]>=3.18.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
